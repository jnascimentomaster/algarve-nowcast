name: refresh-nowcast

# Corre todas as segundas as 06:00 UTC (07:00 em Portugal no inverno, 06:00 no verao).
# Tambem pode ser disparado a mao no separador Actions do GitHub.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Permite ao workflow fazer commit do data.json de volta ao repositorio.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install numpy scikit-learn

      - name: Correr o pipeline
        run: python3 refresh_v4.py

      - name: Fazer commit se o data.json mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "Sem alteracoes no data.json, nada a fazer."
          else
            git commit -m "Atualizacao automatica do nowcast ($(date -u +%Y-%m-%d))"
            git push
          fi
